<script>

/* =====================================================
CONFIG
===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbwvSTmZkm9CGrEW3kJG8Du_THFSNX0fE49y97wElfXzANkfewhp-LuMtyPqZD8P4DWwCg/exec';


let currentProcess = '';

let scannedAwbs = [];

let scanner = null;

let scanLock = false;

let photoStream = null;

let photoBase64 = '';

let snPhotos = [];
let snPhotoStream = null;

let audioContext = null;


/* =====================================================
START
===================================================== */

document.addEventListener(
'DOMContentLoaded',
function(){

  setToday();

  loadValidation();

}
);


/* =====================================================
PILIH PROSES
===================================================== */

function selectProcess(process){

  currentProcess =
    process;


  document.getElementById(
    'menuPage'
  ).style.display =
    'none';


  document.getElementById(
    'formPage'
  ).style.display =
    'block';


  const title =
    document.getElementById(
      'processTitle'
    );


  const tanggalLabel =
    document.getElementById(
      'tanggalLabel'
    );


  const keteranganBox =
    document.getElementById(
      'keteranganBox'
    );


  const reasonBox =
    document.getElementById(
      'reasonBox'
    );


  const photoTitle =
    document.getElementById(
      'photoTitle'
    );


  const photoButton =
    document.getElementById(
      'btnOpenPhoto'
    );


  /* OUTBOUND */

  if(
    process === 'OUTBOUND'
  ){

    title.textContent =
      'OUTBOUND';


    tanggalLabel.textContent =
      'Tanggal Pick Up';


    keteranganBox.style.display =
      'none';


    reasonBox.style.display =
      'none';


    photoTitle.textContent =
      'FOTO DRIVER';


    photoButton.textContent =
      '📷 BUKA KAMERA DRIVER';

    document.getElementById('snSection').style.display = 'block';

  }


  /* BAST */

  else if(
    process === 'BAST'
  ){

    title.textContent =
      'BAST BACK TO WH';


    tanggalLabel.textContent =
      'Tanggal Back to WH';


    keteranganBox.style.display =
      'none';


    reasonBox.style.display =
      'none';


    photoTitle.textContent =
      'FOTO DRIVER';


    photoButton.textContent =
      '📷 BUKA KAMERA DRIVER';

    document.getElementById('snSection').style.display = 'none';

  }


  /* RETURN */

  else if(
    process === 'RETURN'
  ){

    loadValidation();

    title.textContent =
      'RETURN';


    tanggalLabel.textContent =
      'Tanggal Return';


    keteranganBox.style.display =
      'block';


    reasonBox.style.display =
      'block';


    /*
    KHUSUS RETURN
    */
    photoTitle.textContent =
      'FOTO TV+MOBIL';


    photoButton.textContent =
      '📷 BUKA KAMERA TV+MOBIL';

    document.getElementById('snSection').style.display = 'block';

  }


  setToday();

  clearStatus();


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =====================================================
KEMBALI
===================================================== */

async function backMenu(){

  await stopScanner();

  closePhotoCamera();

  closeSnCamera();


  document.getElementById(
    'formPage'
  ).style.display =
    'none';


  document.getElementById(
    'menuPage'
  ).style.display =
    'block';


  clearStatus();


  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
TANGGAL
===================================================== */

function setToday(){

  const now =
    new Date();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth()+1
    ).padStart(
      2,
      '0'
    );


  const d =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );


  document.getElementById(
    'tanggal'
  ).value =
    y+'-'+m+'-'+d;

}


/* =====================================================
VALIDATION
===================================================== */

function loadValidation(){

  const keterangan =
    document.getElementById(
      'keterangan'
    );

  if(!keterangan){
    return;
  }

  keterangan.innerHTML =
    '<option value="">Memuat Keterangan...</option>';

  const callbackName =
    'validationCallback_' +
    Date.now();

  const script =
    document.createElement(
      'script'
    );

  let selesai = false;

  function cleanup(){

    if(selesai){
      return;
    }

    selesai = true;

    try{
      delete window[callbackName];
    }catch(error){}

    try{
      script.remove();
    }catch(error){}

  }

  window[callbackName] =
    function(data){

      keterangan.innerHTML =
        '<option value="">-- Pilih Keterangan --</option>';

      if(
        data &&
        data.success &&
        Array.isArray(data.keterangans)
      ){

        const items =
          data.keterangans
          .map(function(item){
            return String(item || '').trim();
          })
          .filter(Boolean);

        const unik =
          [...new Set(items)];

        unik.forEach(
          function(item){

            const option =
              document.createElement(
                'option'
              );

            option.value =
              item;

            option.textContent =
              item;

            keterangan.appendChild(
              option
            );

          }
        );

        if(unik.length === 0){

          keterangan.innerHTML =
            '<option value="">Data Validation D4:D15 kosong</option>';

          showStatus(
            'Keterangan Return kosong. Isi sheet Validation pada D4:D15.',
            'error'
          );

        }

      }else{

        keterangan.innerHTML =
          '<option value="">Gagal memuat Keterangan</option>';

        showStatus(
          'Keterangan Return gagal dimuat dari sheet Validation.',
          'error'
        );

      }

      cleanup();

    };

  script.onerror =
    function(){

      keterangan.innerHTML =
        '<option value="">Gagal memuat Keterangan</option>';

      showStatus(
        'Keterangan Return gagal dimuat dari Apps Script.',
        'error'
      );

      cleanup();

    };

  script.src =
    API_URL +
    '?action=getValidation' +
    '&callback=' +
    encodeURIComponent(callbackName) +
    '&t=' +
    Date.now();

  document.body.appendChild(
    script
  );

  setTimeout(
    function(){

      if(!selesai){

        keterangan.innerHTML =
          '<option value="">Timeout memuat Keterangan</option>';

        showStatus(
          'Timeout mengambil Keterangan dari Validation.',
          'error'
        );

        cleanup();

      }

    },
    10000
  );

}


/* =====================================================
KAMERA FOTO
===================================================== */

async function openPhotoCamera(){

  clearStatus();


  if(scanner){

    await stopScanner();

  }


  closePhotoCamera();


  try{


    photoStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:'environment'
            }

          },

          audio:false

        });


    const video =
      document.getElementById(
        'photoVideo'
      );


    video.srcObject =
      photoStream;


    await video.play();


    document.getElementById(
      'photoCameraBox'
    ).style.display =
      'block';


    document.getElementById(
      'btnOpenPhoto'
    ).style.display =
      'none';


    if(
      currentProcess ===
      'RETURN'
    ){


      showStatus(
        'Kamera Foto TV+Mobil aktif.',
        'info'
      );


    }else{


      showStatus(
        'Kamera Foto Driver aktif.',
        'info'
      );


    }


  }catch(error){


    console.error(error);


    showStatus(
      'Kamera tidak dapat dibuka. Izinkan akses kamera.',
      'error'
    );


  }

}


/* =====================================================
AMBIL FOTO
===================================================== */

function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){


    showStatus(
      'Kamera belum siap.',
      'error'
    );


    return;

  }


  const canvas =
    document.createElement(
      'canvas'
    );


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  if(
    width > 1280
  ){


    height =
      Math.round(
        height *
        1280 /
        width
      );


    width =
      1280;


  }


  canvas.width =
    width;


  canvas.height =
    height;


  canvas
    .getContext('2d')
    .drawImage(
      video,
      0,
      0,
      width,
      height
    );


  photoBase64 =
    canvas.toDataURL(
      'image/jpeg',
      .72
    );


  document.getElementById(
    'photoPreview'
  ).src =
    photoBase64;


  document.getElementById(
    'photoPreviewBox'
  ).style.display =
    'block';


  closePhotoCamera();


  if(
    currentProcess ===
    'RETURN'
  ){


    showStatus(
      'Foto TV+Mobil berhasil diambil.',
      'success'
    );


  }else{


    showStatus(
      'Foto Driver berhasil diambil.',
      'success'
    );


  }

}


/* =====================================================
TUTUP FOTO
===================================================== */

function closePhotoCamera(){

  if(photoStream){


    photoStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

      'photoVideo'
    );

/* =====================================================
KAMERA FOTO SN
===================================================== */

async function openSnCamera(){
  clearStatus();
  if(scanner) await stopScanner();
  closePhotoCamera();
  closeSnCamera();

  try{
    snPhotoStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });
    const video = document.getElementById('snVideo');
    video.srcObject = snPhotoStream;
    await video.play();
    document.getElementById('snCameraBox').style.display = 'block';
    document.getElementById('btnOpenSnPhoto').style.display = 'none';
    showStatus('Kamera SN aktif. Ambil foto SN satu per satu tanpa keluar dari kamera.', 'info');
  }catch(error){
    console.error(error);
    showStatus('Kamera SN tidak dapat dibuka. Izinkan akses kamera.', 'error');
  }
}

function captureSnPhoto(){
  const video = document.getElementById('snVideo');
  if(!video.videoWidth || !video.videoHeight){
    return showStatus('Kamera SN belum siap.', 'error');
  }

  const canvas = document.createElement('canvas');
  let width = video.videoWidth;
  let height = video.videoHeight;
  if(width > 1280){
    height = Math.round(height * 1280 / width);
    width = 1280;
  }
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(video,0,0,width,height);

  snPhotos.push({
    foto: canvas.toDataURL('image/jpeg', .72),
    noSN: ''
  });
  renderSnPhotos();
  successBeep();
  if(navigator.vibrate) navigator.vibrate(100);
  showStatus('Foto SN tersimpan sementara. Kamera tetap aktif untuk foto SN berikutnya.', 'success');
}

function closeSnCamera(){
  if(snPhotoStream){
    snPhotoStream.getTracks().forEach(track => track.stop());
    snPhotoStream = null;
  }
  const video = document.getElementById('snVideo');
  if(video) video.srcObject = null;
  const box = document.getElementById('snCameraBox');
  const btn = document.getElementById('btnOpenSnPhoto');
  if(box) box.style.display = 'none';
  if(btn) btn.style.display = 'block';
}

function renderSnPhotos(){
  const list = document.getElementById('snList');
  const counter = document.getElementById('snCounter');
  if(counter) counter.textContent = snPhotos.length + ' FOTO SN';
  if(!list) return;

  if(snPhotos.length === 0){
    list.innerHTML = '<div class="awb-empty">Belum ada Foto SN.</div>';
    return;
  }

  list.innerHTML = '';
  snPhotos.forEach(function(item,index){
    const row = document.createElement('div');
    row.className = 'sn-item';

    const img = document.createElement('img');
    img.className = 'sn-thumb';
    img.src = item.foto;

    const info = document.createElement('div');
    info.innerHTML =
      '<div class="sn-pending">Foto SN ' + (index+1) + '</div>' +
      '<div class="sn-note">No SN: MENUNGGU / menyusul</div>';

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'delete-btn';
    del.textContent = 'Hapus';
    del.onclick = function(){
      snPhotos.splice(index,1);
      renderSnPhotos();
    };

    row.appendChild(img);
    row.appendChild(info);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function clearSnPhotos(){
  if(snPhotos.length === 0) return;
  if(!confirm('Hapus semua Foto SN?')) return;
  snPhotos = [];
  renderSnPhotos();
}


/* =====================================================
START SCANNER
===================================================== */

async function startScanner(){

  clearStatus();


  /*
  RETURN SUDAH PUNYA 1 AWB
  JANGAN SCAN LAGI
  */

  if(
    currentProcess === 'RETURN' &&
    scannedAwbs.length >= 1
  ){


    showStatus(
      'RETURN hanya dapat scan 1 AWB. Hapus AWB terlebih dahulu jika ingin scan ulang.',
      'error'
    );


    return;

  }


  try{


    if(!audioContext){


      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();


    }


    if(
      audioContext.state ===
      'suspended'
    ){


      await audioContext.resume();


    }


  }catch(error){}


  closePhotoCamera();


  if(scanner){
    return;
  }


  try{


    scanner =
      new Html5Qrcode(
        'reader'
      );

    await scanner.start(

      {
        facingMode:'environment'
      },

      {

        fps:12,

        qrbox:
          function(width){


            let w =
              Math.floor(
                width*.90
              );


            if(w>380){
              w=380;
            }


            return{
              width:w,
              height:140
            };


          }

      },

      scanSuccess,

      function(){}

    );


    document.getElementById(
      'btnStartScanner'
    ).style.display =
      'none';


    document.getElementById(
      'btnStopScanner'
    ).style.display =
      'block';


    if(
      currentProcess ===
      'RETURN'
    ){


      showStatus(
        'Scanner RETURN aktif. Scan 1 AWB.',
        'info'
      );


    }else{


      showStatus(
        'Scanner aktif. Scan AWB berulang.',
        'info'
      );


    }


  }catch(error){


    console.error(error);


    scanner =
      null;


    showStatus(
      'Kamera scanner gagal dibuka.',
      'error'
    );


  }

}


/* =====================================================
HASIL SCAN
===================================================== */

async function scanSuccess(
  decodedText
){

  if(scanLock){
    return;
  }


  const awb =
    String(
      decodedText || ''
    ).trim();


  if(!awb){
    return;
  }


  scanLock =
    true;


  /*
  ===================================================
  RETURN = HANYA 1 AWB
  ===================================================
  */

  if(
    currentProcess ===
    'RETURN'
  ){


    if(
      scannedAwbs.length >= 1
    ){


      duplicateBeep();


      showStatus(
        'RETURN hanya dapat scan 1 AWB.',
        'error'
      );


      scanLock =
        false;


      return;

    }


    scannedAwbs.push(
      awb
    );


    renderAwbs();


    successBeep();


    if(
      navigator.vibrate
    ){


      navigator.vibrate(
        120
      );


    }


    showStatus(
      'SCAN RETURN BERHASIL: '+
      awb,
      'success'
    );


    /*
    SETELAH 1 AWB
    SCANNER OTOMATIS BERHENTI
    */

    await stopScanner();


    scanLock =
      false;


    return;

  }


  /*
  ===================================================
  OUTBOUND + BAST = SCAN BERULANG
  ===================================================
  */

  if(
    scannedAwbs.includes(
      awb
    )
  ){


    duplicateBeep();


    if(
      navigator.vibrate
    ){


      navigator.vibrate([
        100,
        70,
        100
      ]);


    }


    showStatus(
      'AWB sudah pernah discan: '+
      awb,
      'error'
    );


  }else{


    scannedAwbs.push(
      awb
    );


    renderAwbs();


    successBeep();


    if(
      navigator.vibrate
    ){


      navigator.vibrate(
        120
      );


    }


    showStatus(
      'SCAN BERHASIL: '+
      awb,
      'success'
    );


  }


  setTimeout(
    function(){

      scanLock =
        false;

    },
    1000
  );

}


/* =====================================================
STOP SCANNER
===================================================== */

async function stopScanner(){

  if(!scanner){
    return;
  }


  try{


    await scanner.stop();


    scanner.clear();


  }catch(error){}


  scanner =
    null;


  document.getElementById(
    'btnStartScanner'
  ).style.display =
    'block';


  document.getElementById(
    'btnStopScanner'
  ).style.display =
    'none';

}


/* =====================================================
SUARA
===================================================== */

function successBeep(){

  try{


    if(!audioContext){
      return;
    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      1100;


    gain.gain.value =
      .28;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime+
      .15
    );


  }catch(error){}

}


function duplicateBeep(){

  try{


    if(!audioContext){
      return;
    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      350;


    gain.gain.value =
      .20;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime+
      .22
    );


  }catch(error){}

}


/* =====================================================
DAFTAR AWB
===================================================== */

function renderAwbs(){

  const list =
    document.getElementById(
      'awbList'
    );


  document.getElementById(
    'awbCounter'
  ).textContent =
    scannedAwbs.length+
    ' AWB';


  if(
    currentProcess === 'OUTBOUND' &&
    snPhotos.length === 0
  ){
    return showStatus(
      'Outbound wajib memiliki minimal 1 Foto SN.',
      'error'
    );
  }

  if(
    scannedAwbs.length === 0
  ){


    list.innerHTML =
      '<div class="awb-empty">Belum ada AWB.</div>';


    return;

  }


  list.innerHTML =
    '';


  scannedAwbs.forEach(
    function(
      awb,
      index
    ){


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'awb-item';


      const text =
        document.createElement(
          'div'
        );


      text.className =
        'awb-text';


      text.textContent =
        (index+1)+
        '. '+
        awb;


      const del =
        document.createElement(
          'button'
        );


      del.type =
        'button';


      del.className =
        'delete-btn';


      del.textContent =
        'Hapus';


      del.onclick =
        function(){


          scannedAwbs.splice(
            index,
            1
          );


          renderAwbs();


        };


      row.appendChild(
        text
      );


      row.appendChild(
        del
      );


      list.appendChild(
        row
      );


    }
  );

}


/* =====================================================
HAPUS AWB

function clearAwbs(){

/* =====================================================
SIMPAN
===================================================== */

async function saveData(){

  clearStatus();


  const tanggal =
    document.getElementById(
      'tanggal'
    ).value;


  const driver =
    document.getElementById(
      'namaDriver'
    ).value.trim();


  const plat =
    document.getElementById(
      'platNo'
    ).value.trim();


  const vendor =
    document.getElementById(
      'vendor'
    ).value.trim();


  const keterangan =
    document.getElementById(
      'keterangan'
    ).value;


  const reason =
    document.getElementById(
      'reason'
    ).value.trim();


  /* VALIDASI */

  if(!tanggal){

    return showStatus(
      'Tanggal wajib diisi.',
      'error'
    );

  }


  if(!driver){

    return showStatus(
      'Nama Driver wajib diisi.',
      'error'
    );

  }


  if(!plat){

    return showStatus(
      'Plat No wajib diisi.',
      'error'
    );

  }


  if(!vendor){

    return showStatus(
      'Vendor wajib diisi.',
      'error'
    );

  }


  if(
    currentProcess ===
    'RETURN' &&
    !keterangan
  ){


    return showStatus(
      'Keterangan Return wajib dipilih.',
      'error'
    );


  }


  if(
    currentProcess ===
    'RETURN' &&
    !reason
  ){


    return showStatus(
      'Reason wajib diisi.',
      'error'
    );


  }


  if(!photoBase64){


    if(
      currentProcess ===
      'RETURN'
    ){


      return showStatus(
        'Foto TV+Mobil wajib diambil.',
        'error'
      );


    }


    return showStatus(
      'Foto Driver wajib diambil.',
      'error'
    );

  }


  if(
    scannedAwbs.length === 0
  ){


    return showStatus(
      'Belum ada AWB.',
      'error'
    );


  }


  /*
  KEAMANAN TAMBAHAN
  RETURN HARUS TEPAT 1 AWB
  */

  if(
    currentProcess ===
    'RETURN' &&
    scannedAwbs.length !== 1
  ){


    return showStatus(
      'RETURN harus memiliki tepat 1 AWB.',
      'error'
    );


  }


  const btn =
    document.getElementById(
      'btnSave'
    );


  btn.disabled =
    true;


  btn.textContent =
    'MENYIMPAN...';


  try{


    await stopScanner();


    closePhotoCamera();


    const payload = {


      action:
        'save',


      process:
        currentProcess,


      tanggal:
        tanggal,


      namaDriver:
        driver,


      platNo:
        plat,


      vendor:
        vendor,


      keterangan:
        keterangan,


      reason:
        reason,


      awbs:
        scannedAwbs,


      fotoDriver:
        photoBase64,

      fotoSN:
        snPhotos.map(function(item){
          return {
            foto:item.foto,
            noSN:item.noSN || ''
          };
        })


    };


    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers:{

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    const text =
      await response.text();


    const result =
      JSON.parse(
        text
      );


    if(
      !result.success
    ){


      throw new Error(
        result.message ||
        'Gagal menyimpan.'
      );


    }


    alert(
      result.jumlah+
      ' AWB berhasil disimpan ke '+
      result.sheet
    );


    /*
    KEMBALI KE DEPAN
    DAN KOSONGKAN SEMUA
    */

    resetApplication();


  }catch(error){


    console.error(error);


    showStatus(
      'Gagal menyimpan: '+
      error.message,
      'error'
    );


  }finally{


    btn.disabled =
      false;


    btn.textContent =
      '💾 SIMPAN DATA';


  }

}


/* =====================================================
STATUS
===================================================== */

function showStatus(
  message,
  type
){

  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status '+type;


  status.textContent =
    message;

}


function clearStatus(){

  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status';


  status.textContent =
    '';

}

</script>


<script>
let hJoelInstallPrompt = null;

function hJoelStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', function(event){
  event.preventDefault();
  hJoelInstallPrompt = event;

  const button = document.getElementById('installAppBtn');
  if(button && !hJoelStandalone()){
    button.style.display = 'block';
  }
});

window.addEventListener('appinstalled', function(){
  hJoelInstallPrompt = null;
  const button = document.getElementById('installAppBtn');
  const help = document.getElementById('installHelp');
  if(button) button.style.display = 'none';
  if(help) help.textContent = 'Aplikasi berhasil terpasang.';
});

document.addEventListener('DOMContentLoaded', function(){
  const button = document.getElementById('installAppBtn');
  const help = document.getElementById('installHelp');

  if(hJoelStandalone()){
    if(button) button.style.display = 'none';
    return;
  }

  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    if(help){
      help.textContent = 'iPhone/iPad: Safari → Share → Add to Home Screen.';
    }
  }

  if(button){
    button.addEventListener('click', async function(){
      if(hJoelInstallPrompt){
        hJoelInstallPrompt.prompt();
        await hJoelInstallPrompt.userChoice;
        hJoelInstallPrompt = null;
        button.style.display = 'none';
      }else if(help){
        help.textContent =
          'Android: buka menu Chrome lalu pilih Install app / Instal aplikasi.';
      }
    });
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./service-worker.js', {scope:'./'})
      .catch(function(error){
        console.error('Service Worker gagal:', error);
      });
  });
}
</script>
